<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>CityMoodWeather</title></head>
<body>

<div class="cw-stage cw-stage--center" style="gap:16px;align-items:flex-start">
  <div style="display:flex;flex-direction:column;gap:12px;width:300px">
    <span class="cw-chip"><span class="cw-chip__dot" style="--m:var(--mood-calm)"></span>今晚的城市 · 平靜 38%</span>
    <span class="cw-chip"><span class="cw-chip__dot"></span>今晚的城市還很安靜</span>
    <div class="cw-glass" style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
      <h3 class="cw-gradient-title">今晚的城市心情</h3>
      <p class="cw-glass__body">城市還很安靜，今晚有 4 個人留下心情。</p>
      <p class="cw-glass__body">多一點心情，城市就多一點光。寫下此刻的你，成為點亮城市的人。</p>
    </div>
  </div>
  <div class="cw-glass cw-glass--glow" style="width:330px;display:flex;flex-direction:column;gap:16px">
    <h3 class="cw-gradient-title">今晚的城市心情</h3>
    <p class="cw-glass__body">20 公里內，今晚有 128 個人留下心情</p>
    <div class="cw-bars"><div class="cw-bar" style="--m:var(--mood-calm)"><span>平靜</span><span class="cw-bar__track"><span class="cw-bar__fill" style="display:block;width:38%"></span></span><span class="cw-bar__pct">38%</span></div><div class="cw-bar" style="--m:var(--mood-joy)"><span>開心</span><span class="cw-bar__track"><span class="cw-bar__fill" style="display:block;width:24%"></span></span><span class="cw-bar__pct">24%</span></div><div class="cw-bar" style="--m:var(--mood-love)"><span>愛</span><span class="cw-bar__track"><span class="cw-bar__fill" style="display:block;width:16%"></span></span><span class="cw-bar__pct">16%</span></div><div class="cw-bar" style="--m:var(--mood-sad)"><span>難過</span><span class="cw-bar__track"><span class="cw-bar__fill" style="display:block;width:12%"></span></span><span class="cw-bar__pct">12%</span></div><div class="cw-bar" style="--m:var(--mood-default)"><span>其他</span><span class="cw-bar__track"><span class="cw-bar__fill" style="display:block;width:10%"></span></span><span class="cw-bar__pct">10%</span></div></div>
    <p class="cw-caption">匿名統計 24 小時內的心情；少於 10 人時不顯示比例。</p>
  </div>
</div>
</body>
</html>
