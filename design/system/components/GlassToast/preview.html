<!doctype html>
<html>
<head><meta charset="utf-8"><title>GlassToast</title></head>
<body>

<div class="cw-stage" style="flex-direction:column">
  <div class="cw-toast"><span class="cw-ico cw-toast__icon i-send"></span><span class="cw-toast__text">來自 <b>安卓Pixel 9</b> 的低語：今晚的風好舒服</span></div>
  <div class="cw-toast"><span class="cw-ico cw-toast__icon i-heart"></span><span class="cw-toast__text">敲門聲已送出，等待回音…</span></div>
  <div class="cw-toast cw-toast--danger"><span class="cw-ico cw-toast__icon i-close"></span><span class="cw-toast__text">敲門沒有送出，請稍後再試。</span></div>
</div>
</body>
</html>
