<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 心情據點落地頁，由 tool/build_places.py 從 tool/place_page.html 產生，請勿直接修改 -->
<title>{name}｜心情據點・城市低語</title>
<meta name="description" content="「{story}」— {name}，城市低語的心情據點。">
<meta name="theme-color" content="#070b1f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="城市低語">
<meta property="og:title" content="{name}｜城市低語的心情據點">
<meta property="og:description" content="「{story}」">
<meta property="og:image" content="{site}/img/place/{pid}.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{url}">
<meta name="twitter:card" content="summary_large_image">{robots}
<link rel="icon" href="/img/icon.png">
<link rel="apple-touch-icon" href="/img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Chakra+Petch:wght@500;600&display=swap">
<style>
  /* 城市低語 夜光設計系統 */
  :root {{
    color-scheme: dark;
    --night-900: #070b1f; --night-800: #0e1433; --night-700: #1a1f4a; --night-600: #2a2f66;
    --glass-fill: rgba(26, 31, 74, 0.72); --glass-line: rgba(196, 170, 255, 0.38);
    --ink: #f3f0ff; --ink-muted: #b9b6d6; --ink-faint: #8c89b0;
    --aurora-violet: #b44cff; --aurora-blue: #4fc3f7; --city-amber: #ffc56b;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "Chakra Petch", "Noto Sans TC", ui-monospace, monospace;
  }}
  * {{ box-sizing: border-box; }}
  html, body {{ margin: 0; background: var(--night-900); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }}
  body {{ background: radial-gradient(120% 50% at 80% -10%, rgba(142,45,226,.24), transparent 60%), var(--night-900); min-height: 100vh; }}
  a {{ color: var(--aurora-blue); }}
  .wrap {{ max-width: 520px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }}
  .back {{ display: inline-block; color: var(--ink-faint); text-decoration: none; font-size: 14px; margin-bottom: 16px; }}

  .card {{ border-radius: 24px; overflow: hidden; background: var(--night-800); border: 1px solid var(--glass-line); box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 50px rgba(255,197,107,.08); }}
  .photo {{ position: relative; aspect-ratio: 16 / 10; max-width: 100%; }}
  .photo img {{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }}
  .photo::after {{ content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,11,31,.5) 0%, transparent 30%, transparent 55%, var(--night-800) 100%); }}
  .tag {{ position: absolute; z-index: 1; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; }}
  .pill {{ display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--glass-fill); border: 1px solid var(--glass-line); font-size: 12px; letter-spacing: 2px; }}
  .pill svg {{ filter: drop-shadow(0 0 4px var(--city-amber)); }}
  .no {{ font-family: var(--mono); font-size: 13px; letter-spacing: 2px; color: var(--ink-muted); }}
  .body {{ display: grid; gap: 16px; padding: 0 22px 24px; margin-top: -28px; position: relative; }}
  h1 {{ margin: 0; font-size: 26px; letter-spacing: 2px; text-wrap: balance; }}
  .story {{ margin: 0; font-size: 19px; line-height: 1.75; font-weight: 500; text-wrap: balance; }}
  .rule {{ width: 64px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--aurora-violet), var(--aurora-blue)); }}
  .info {{ margin: 0; display: grid; gap: 4px; font-size: 14px; line-height: 1.7; color: var(--ink-muted); }}
  .info a {{ color: var(--ink-muted); text-underline-offset: 3px; }}
  table {{ border-collapse: collapse; font-size: 14px; color: var(--ink-muted); }}
  th {{ text-align: left; font-weight: 400; color: var(--ink-faint); padding: 2px 16px 2px 0; }}
  td {{ font-family: var(--mono); letter-spacing: .5px; padding: 2px 0; }}
  td.off {{ font-family: var(--sans); color: var(--ink-faint); }}
  details summary {{ cursor: pointer; font-size: 14px; color: var(--ink-muted); }}
  details table {{ margin-top: 8px; }}

  .how {{ margin-top: 28px; display: grid; gap: 12px; }}
  .how h2 {{ margin: 0; font-size: 18px; letter-spacing: 1px; }}
  .how ol {{ margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }}
  .how li {{ display: flex; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--glass-fill); border: 1px solid var(--glass-line); font-size: 14px; line-height: 1.7; color: var(--ink-muted); }}
  .how li b {{ flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--mono); color: var(--ink); background: var(--night-700); border: 1px solid var(--glass-line); }}
  .cta {{ display: block; margin-top: 24px; padding: 16px; border-radius: 16px; text-align: center; text-decoration: none; font-size: 17px; font-weight: 700; letter-spacing: 2px; color: #fff;
    background: linear-gradient(90deg, #8e2de2, #2a63d4); box-shadow: 0 10px 30px rgba(142,45,226,.35); }}
  .stores {{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }}
  .stores .cta {{ margin-top: 0; font-size: 15px; letter-spacing: 1px; }}
  .stores .cta.alt {{ background: var(--night-700); border: 1px solid var(--glass-line); box-shadow: none; }}
  .fine {{ margin: 10px 0 0; text-align: center; font-size: 12px; line-height: 1.8; color: var(--ink-faint); }}
  footer {{ margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--night-600); font-size: 13px; line-height: 2; }}
  footer a {{ color: var(--ink-faint); text-decoration: none; margin-right: 16px; }}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="/">← 城市低語</a>

  <article class="card">
    <div class="photo">
      <img src="/img/place/{pid}.webp" alt="{name} 店裡往外看的夜景" width="960" height="600">
      <div class="tag">
        <span class="pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffc56b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V8z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v2M12 3v2"/></svg>心情據點</span>
        <span class="no">{no}</span>
      </div>
    </div>
    <div class="body">
      <h1>{name}</h1>
      <p class="story">「{story}」</p>
      <div class="rule"></div>
      <p class="info">
        <a href="{maps}" target="_blank" rel="noopener">{address}</a>
        <span>{phone}</span>
      </p>
      <details>
        <summary>營業時間</summary>
        <table>
        {hours}
        </table>
      </details>
    </div>
  </article>

  <section class="how" aria-labelledby="how">
    <h2 id="how">在城市低語裡遇見這家店</h2>
    <ol>
      <li><b>1</b><span>打開城市低語、打卡，用一句心情進入夜裡的城市。</span></li>
      <li><b>2</b><span>營業時間內走到店門口 150 公尺內，雷達上會亮起一盞咖啡杯小燈，慢慢呼吸。</span></li>
      <li><b>3</b><span>點一下小燈，就能讀到店裡留下的這句話。我們不追蹤你去過哪裡，店家也不會知道是誰經過。</span></li>
    </ol>
  </section>

{cta}

  <footer>
    <a href="/">城市低語</a>
    <a href="/terms.html">使用條款</a>
    <a href="/privacy.html">隱私權政策</a>
  </footer>
</main>
</body>
</html>
