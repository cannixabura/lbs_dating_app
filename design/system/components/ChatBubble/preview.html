<!-- @dsCard group="Chat" height=470 subtitle="Header with countdown and 檢舉, messages, compose" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ChatBubble</title></head>
<body>

<div class="cw-stage cw-stage--center" style="background:var(--night-800)">
  <div class="cw-chat">
    <div class="cw-chat__head">
      <div class="cw-avatar cw-avatar--sm"><span class="cw-ico cw-ico--sm i-person"></span></div>
      <div class="cw-chat__grow"><div class="cw-chat__name">與 安卓Pixel 9 的交集</div><div class="cw-chat__sub">倒數 <span style="font-family:var(--font-numeral);color:var(--knock-pink)">09:57</span> 消散</div></div>
      <button class="cw-iconbtn" type="button" aria-label="檢舉"><span class="cw-ico i-flag"></span></button>
    </div>
    <p class="cw-msg__who">安卓Pixel 9</p>
    <div class="cw-msg cw-msg--them">嗨，你也在河堤這邊嗎？</div>
    <div class="cw-msg cw-msg--them">剛剛看到你的心情氣泡</div>
    <div class="cw-msg cw-msg--me">對呀，風好舒服，正在散步</div>
    <div class="cw-compose" style="margin-top:8px">
      <input class="cw-input" id="chat-compose" placeholder="輕聲說點什麼…" style="border-radius:var(--radius-pill)">
      <button class="cw-iconbtn cw-iconbtn--fill" type="button" aria-label="送出"><span class="cw-ico i-send"></span></button>
    </div>
  </div>
</div>
</body>
</html>
