<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>BlockList</title></head>
<body>

<div class="cw-stage cw-stage--center" style="gap:16px;align-items:flex-start">
  <div class="cw-glass" style="width:340px;max-width:100%;display:flex;flex-direction:column;gap:12px">
    <h3 class="cw-glass__title" style="margin:0">沉入黑暗的名單</h3>
    <div class="cw-blocklist">
        <div class="cw-blockrow"><span class="cw-blockrow__face"><span class="cw-ico cw-ico--sm i-person"></span></span><span class="cw-blockrow__name">遊蕩的貓 <span class="cw-blockrow__id">(#7204)</span></span><button class="cw-btn cw-btn--link" type="button">解除放逐</button></div>
        <div class="cw-blockrow"><span class="cw-blockrow__face"><span class="cw-ico cw-ico--sm i-person"></span></span><span class="cw-blockrow__name">夜行的鹿 <span class="cw-blockrow__id">(#A91C)</span></span><button class="cw-btn cw-btn--link" type="button">解除放逐</button></div>
        <div class="cw-blockrow"><span class="cw-blockrow__face"><span class="cw-ico cw-ico--sm i-person"></span></span><span class="cw-blockrow__name">#4582</span><button class="cw-btn cw-btn--link" type="button">解除放逐</button></div>
        <div class="cw-blockrow"><span class="cw-blockrow__face"><span class="cw-ico cw-ico--sm i-person"></span></span><span class="cw-blockrow__name">一個很長很長的城市稱呼 <span class="cw-blockrow__id">(#0E3F)</span></span><button class="cw-btn cw-btn--link" type="button">解除放逐</button></div>
    </div>
    <button class="cw-btn cw-btn--ghost cw-btn--block" type="button" style="margin-top:4px">關閉</button>
  </div>

  <div style="width:340px;max-width:100%;display:flex;flex-direction:column;gap:12px">
    <p class="cw-note">還沒有封鎖任何人</p>
    <div class="cw-glass" style="display:flex;flex-direction:column;gap:12px">
      <h3 class="cw-glass__title" style="margin:0">沉入黑暗的名單</h3>
      <div class="cw-empty-night"><span class="cw-ico i-moon" style="width:40px;height:40px"></span><p class="cw-glass__body">夜色清朗，你的城市未曾放逐任何人。</p></div>
      <button class="cw-btn cw-btn--ghost cw-btn--block" type="button">關閉</button>
    </div>
    <p class="cw-note" style="margin-top:8px">提示</p>
    <div class="cw-toast cw-toast--danger"><span class="cw-ico cw-toast__icon i-block"></span><span class="cw-toast__text">已將此人沒入黑暗。</span></div>
    <div class="cw-toast"><span class="cw-ico cw-toast__icon i-moon"></span><span class="cw-toast__text">已解除封鎖，城市再次產生交集。</span></div>
  </div>
</div>
</body>
</html>
