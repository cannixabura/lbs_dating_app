<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>.cover .name { max-width: 600px; }</style><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--night-900); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--night-900); }
  .cover svg { position: absolute; inset: 0; }
  .slab { fill: var(--night-700); }
  .violet { fill: var(--aurora-violet); }
  .blue { fill: var(--aurora-blue); }
  .pink { fill: var(--knock-pink); }
  .amber { fill: var(--city-amber); }
  .ring { fill: none; stroke: var(--ink-faint); stroke-width: 1.5px; }
  .r-lg { rx: var(--radius-lg); }
  .r-md { rx: var(--radius-md); }
  .r-pill-88 { rx: 44px; }
  .name { position: absolute; left: 48px; bottom: 40px; max-width: 440px; }
  .name h1 { margin: 0; font: 700 72px/0.95 var(--font-sans); letter-spacing: 2px; color: var(--ink); }
  .name p { margin: 16px 0 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: night-700 slab 232×336 (bleeds top and bottom), aurora-violet 168×96 radius-lg, aurora-blue 232×88 pill bleeding right,
              knock-pink disc r40, city-amber 64×64 radius-md — the sky, the gradient's two ends, a knock, a street light.
      arrangement: one tall slab with satellites, everything right of x=480.
      pattern: literal motif — the radar's ground ripple, four ellipses; the app's own signal of "someone is here".
      scales: gaps space-6 (24) and space-8 (32) multiples; radii radius-md, radius-lg, pill = half of 88.
    -->
    <rect class="slab" x="600" y="-24" width="232" height="336"></rect>
    <rect class="violet r-lg" x="504" y="48" width="168" height="96"></rect>
    <rect class="amber r-md" x="520" y="192" width="64" height="64"></rect>
    <rect class="blue r-pill-88" x="760" y="176" width="232" height="88"></rect>
    <circle class="pink" cx="880" cy="80" r="40"></circle>
    <ellipse class="ring" cx="716" cy="168" rx="40" ry="14"></ellipse>
    <ellipse class="ring" cx="716" cy="168" rx="80" ry="28"></ellipse>
    <ellipse class="ring" cx="716" cy="168" rx="120" ry="42"></ellipse>
    <ellipse class="ring" cx="716" cy="168" rx="160" ry="56"></ellipse>
  </svg>
  <div class="name">
    <h1>城市低語<br>夜光設計系統</h1>
    <p>一座夜裡的城市，和浮在建築之間、會呼吸的心情氣泡。</p>
  </div>
</div>
</body>
</html>
