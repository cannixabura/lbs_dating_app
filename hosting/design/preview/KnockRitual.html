<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>KnockRitual</title></head>
<body>

<div class="cw-stage cw-stage--center" style="gap:16px">
  <div class="cw-map" style="position:relative;width:330px;height:430px;border-radius:24px">
    <svg class="cw-arc" viewBox="0 0 330 430" aria-hidden="true">
      <path class="cw-arc__glow" d="M165 360 Q 130 200 238 150"/>
      <path class="cw-arc__dots" d="M165 360 Q 130 200 238 150"/>
    </svg>
    <div style="position:absolute;top:14px;left:0;right:0;text-align:center">
      <span class="cw-wait"><span class="cw-ico cw-ico--sm i-hourglass"></span>等待 遊蕩的貓 回音 <span class="cw-wait__time">04:57</span><span class="cw-wait__bar"><i style="width:99%"></i></span></span>
    </div>
    <div class="cw-bubble cw-bubble--knocking" style="position:absolute;left:172px;top:72px;--m:var(--mood-calm)">
      <div class="cw-bubble__body"><span class="cw-bubble__mood">平靜地散步🌿</span></div>
      <span class="cw-bubble__pin"></span><span class="cw-bubble__ripple"></span>
      <span class="cw-bubble__caption">遊蕩的貓 · 150m</span>
    </div>
    <span class="cw-me" style="left:154px;top:349px"></span>
  </div>
  <div class="cw-map" style="position:relative;width:330px;height:430px;border-radius:24px">
    <div style="position:absolute;top:14px;left:0;right:0;text-align:center">
      <span class="cw-wait cw-wait--warn"><span class="cw-ico cw-ico--sm i-hourglass"></span>等待 遊蕩的貓 回音 <span class="cw-wait__time">00:42</span><span class="cw-wait__bar"><i style="width:14%"></i></span></span>
    </div>
    <div class="cw-bubble" style="position:absolute;left:99px;top:150px;--m:var(--mood-calm)">
      <div class="cw-bubble__body"><span class="cw-bubble__mood">平靜地散步🌿</span></div>
      <span class="cw-bubble__pin"></span><span class="cw-bubble__ripple"></span>
      <span class="cw-bubble__caption">遊蕩的貓 · 150m</span>
    </div>
    <span class="cw-burst" style="left:165px;top:200px;--c:var(--knock-pink)"><i style="--x:-25px;--y:-58px;--d:0.02s"></i><i style="--x:-1px;--y:-79px;--d:0.13s"></i><i style="--x:-75px;--y:-16px;--d:0.02s"></i><i style="--x:-31px;--y:-105px;--d:0.06s"></i><i style="--x:43px;--y:-106px;--d:0.10s"></i><i style="--x:50px;--y:-15px;--d:0.07s"></i><i style="--x:-48px;--y:-34px;--d:0.20s"></i><i style="--x:-64px;--y:-52px;--d:0.09s"></i><i style="--x:-2px;--y:-61px;--d:0.05s"></i><i style="--x:35px;--y:-71px;--d:0.15s"></i><i style="--x:-3px;--y:-75px;--d:0.17s"></i><i style="--x:-57px;--y:-65px;--d:0.22s"></i><i style="--x:50px;--y:-58px;--d:0.03s"></i><i style="--x:-31px;--y:-100px;--d:0.12s"></i><i style="--x:-75px;--y:-16px;--d:0.14s"></i><i style="--x:61px;--y:-34px;--d:0.15s"></i><i style="--x:25px;--y:-83px;--d:0.24s"></i><i style="--x:-16px;--y:-98px;--d:0.18s"></i></span>
    <div style="position:absolute;bottom:18px;left:12px;right:12px">
      <div class="cw-toast" style="width:auto"><span class="cw-ico cw-toast__icon i-moon"></span><span class="cw-toast__text">這次沒有交集，讓彼此保留一點空間。</span></div>
    </div>
  </div>
</div>
</body>
</html>
