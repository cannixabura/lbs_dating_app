<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>GlassCard</title></head>
<body>

<div class="cw-stage cw-map" style="min-height:300px">
  <div class="cw-glass" style="width:280px">
    <h3 class="cw-glass__title">片刻交集</h3>
    <p class="cw-glass__body">玻璃卡片承載所有浮在城市上的訊息。</p>
  </div>
  <div class="cw-glass cw-glass--form" style="width:280px;text-align:center">
    <h3 class="cw-glass__title">沉入黑暗的名單</h3>
    <span class="cw-ico cw-ico--lg i-moon" style="color:var(--ink-faint);margin:8px auto"></span>
    <p class="cw-glass__body">夜色清朗，你的城市未曾放逐任何人。</p>
  </div>
</div>
</body>
</html>
