<!-- @dsCard group="Radar" height=330 subtitle="Active, resting, shadow and knocking, over the night map" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MoodBubble</title></head>
<body>

<div class="cw-stage cw-stage--center cw-map" style="min-height:330px;align-items:flex-end;gap:12px 20px;padding-top:40px">
  <div class="cw-bubble" style="--m:var(--mood-love)">
    <div class="cw-bubble__body"><span class="cw-bubble__mood">好愛這座城市💖</span></div>
    <span class="cw-bubble__pin"></span><span class="cw-bubble__ripple"></span>
    <span class="cw-bubble__caption">遊蕩的貓 · 41m</span>
  </div>
  <div class="cw-bubble cw-bubble--resting" style="--m:var(--mood-passion)">
    <div class="cw-bubble__body"><span class="cw-bubble__mood">熱情地喝一杯咖啡</span></div>
    <span class="cw-bubble__pin"></span><span class="cw-bubble__ripple"></span>
    <span class="cw-bubble__caption">阿哲 · 120m<span class="cw-tag">休息中</span></span>
  </div>
  <div class="cw-bubble cw-bubble--shadow">
    <div class="cw-bubble__body"><span class="cw-bubble__mood">雨好大，有點難過</span></div>
    <span class="cw-bubble__pin"></span><span class="cw-bubble__ripple"></span>
    <span class="cw-bubble__caption">歷史殘影 · 300m</span>
  </div>
  <div class="cw-bubble cw-bubble--knocking" style="--m:var(--mood-calm)">
    <div class="cw-bubble__body"><span class="cw-bubble__mood">平靜地漫步在微雨中🌿</span></div>
    <span class="cw-bubble__pin"></span><span class="cw-bubble__ripple"></span>
    <span class="cw-bubble__caption">敲門中 · 04:57</span>
  </div>
</div>
</body>
</html>
